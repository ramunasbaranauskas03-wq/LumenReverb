name: Build Lumen Plugins (macOS)

on:
  push:
  workflow_dispatch:
    inputs:
      universal:
        description: "Universal build (Apple Silicon + Intel Macs). Off = Apple Silicon only, faster"
        type: boolean
        default: false

# a new upload cancels the build that is still running -> no queue pile-ups
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        plugin:
          - { target: LumenReverb, product: "Lumen Reverb" }
          - { target: LumenDelay, product: "Lumen Delay" }
          - { target: LumenCompressor, product: "Lumen Compressor" }
          - { target: LumenPump, product: "Lumen Pump" }
          - { target: LumenLimiter, product: "Lumen Limiter" }
          - { target: LumenBass, product: "Lumen Bass" }
          - { target: LumenSaturator, product: "Lumen Saturator" }
          - { target: LumenEQ, product: "Lumen EQ" }
          - { target: LumenSynth, product: "Lumen Synth" }
          - { target: LumenReference, product: "Lumen Reference" }
          - { target: LumenFilter, product: "Lumen Filter" }
          - { target: LumenSpaceControl, product: "Lumen Space Control" }
          - { target: LumenTransient, product: "Lumen Transient" }
          - { target: LumenClipper, product: "Lumen Clipper" }
          - { target: LumenVocal, product: "Lumen Vocal" }
          - { target: LumenOTT, product: "Lumen OTT" }
          - { target: LumenMod, product: "Lumen Mod" }
          - { target: LumenGate, product: "Lumen Gate" }
          - { target: LumenMonoFilter, product: "Lumen MonoFilter" }
          - { target: LumenResonance, product: "Lumen Resonance" }
          - { target: LumenGlitch, product: "Lumen Glitch" }
          - { target: LumenLoFi, product: "Lumen LoFi" }
          - { target: LumenKick, product: "Lumen Kick Designer" }
          - { target: LumenMeter, product: "Lumen Meter" }
          - { target: LumenChord, product: "Lumen Chord" }
          - { target: LumenRiser, product: "Lumen Riser" }
          - { target: LumenMelody, product: "Lumen Melody Bass" }
          - { target: LumenDrums, product: "Lumen Drums" }
          - { target: LumenSampler, product: "Lumen Sampler" }
          - { target: LumenMaster, product: "Lumen Master" }
          - { target: LumenSynthSampler, product: "Lumen Synth Sampler" }
          - { target: LumenMixCheck, product: "Lumen MixCheck" }
          - { target: LumenSynthXL, product: "Lumen Synth XL" }
          - { target: LumenSpectrum, product: "Lumen Spectrum" }
          - { target: LumenReverse, product: "Lumen Reverse" }
    runs-on: macos-15
    name: ${{ matrix.plugin.target }}
    env:
      ARCHS: ${{ (github.event_name == 'workflow_dispatch' && inputs.universal) && 'arm64;x86_64' || 'arm64' }}

    steps:
      - uses: actions/checkout@v4

      - name: Locate project
        run: |
          SRC=$(grep -rl --include=CMakeLists.txt "project(${{ matrix.plugin.target }} " . | head -1 | xargs dirname)
          if [ -z "$SRC" ]; then echo "::error::${{ matrix.plugin.target }} not found in repo"; exit 1; fi
          echo "Found project in $SRC"
          echo "SRC=$SRC" >> "$GITHUB_ENV"

      - name: Configure
        run: cmake -S "$SRC" -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="$ARCHS" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Package
        run: |
          ART="build/${{ matrix.plugin.target }}_artefacts/Release"
          mkdir -p "dist/VST3" "dist/Components"
          cp -R "$ART/VST3/${{ matrix.plugin.product }}.vst3" dist/VST3/
          cp -R "$ART/AU/${{ matrix.plugin.product }}.component" dist/Components/
          codesign --force --deep -s - "dist/VST3/${{ matrix.plugin.product }}.vst3"
          codesign --force --deep -s - "dist/Components/${{ matrix.plugin.product }}.component"

      - name: Validate Audio Unit
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R dist/Components/*.component ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          sleep 3
          LINE=$(auval -a 2>/dev/null | grep -i "Lmn\|Lumen" | grep -i "${{ matrix.plugin.product }}" | head -1 || true)
          echo "$LINE"
          if [ -n "$LINE" ]; then
            set -- $LINE
            auval -strict -v "$1" "$2" "$3" | tail -5 || echo "::warning::auval reported problems for ${{ matrix.plugin.product }}"
          else
            echo "::warning::${{ matrix.plugin.product }} AU not listed by auval"
          fi

      - name: Zip (keeps the executable bits macOS bundles need)
        run: ditto -c -k dist "part-${{ matrix.plugin.target }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: part-${{ matrix.plugin.target }}
          path: part-${{ matrix.plugin.target }}.zip
          retention-days: 7

  bundle:
    needs: build
    if: always()
    runs-on: macos-15
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: part-*
          path: parts
          merge-multiple: true

      - name: Make installer bundle
        run: |
          mkdir -p Lumen
          for z in parts/*.zip; do ditto -x -k "$z" Lumen; done
          cat > Lumen/Install.command <<'SH'
          #!/bin/bash
          # Installs every Lumen plugin for the current user and clears the download quarantine.
          cd "$(dirname "$0")"
          VST3="$HOME/Library/Audio/Plug-Ins/VST3"
          AU="$HOME/Library/Audio/Plug-Ins/Components"
          mkdir -p "$VST3" "$AU"
          for p in VST3/*.vst3; do rm -rf "$VST3/$(basename "$p")"; cp -R "$p" "$VST3/"; done
          for p in Components/*.component; do rm -rf "$AU/$(basename "$p")"; cp -R "$p" "$AU/"; done
          xattr -dr com.apple.quarantine "$VST3"/Lumen*.vst3 "$AU"/Lumen*.component 2>/dev/null
          killall -9 AudioComponentRegistrar 2>/dev/null
          echo ""
          echo "Installed $(ls -d VST3/*.vst3 | wc -l | tr -d ' ') Lumen plugins (VST3 + AU)."
          echo "Open Ableton -> Settings -> Plug-Ins -> Rescan."
          SH
          chmod +x Lumen/Install.command
          echo "Plugins in bundle: $(ls -d Lumen/VST3/*.vst3 | wc -l)"
          ls Lumen/VST3
          ditto -c -k --keepParent Lumen Lumen-macOS.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Lumen-ALL-macOS
          path: Lumen-macOS.zip
          retention-days: 30
